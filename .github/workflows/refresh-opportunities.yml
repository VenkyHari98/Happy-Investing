name: Refresh Opportunity Data

on:
  schedule:
    - cron: "15 10 * * 1-5"   # ~3:45 PM IST, Mon-Fri (after NSE close)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore OHLCV / fundamentals cache
        uses: actions/cache@v4
        with:
          path: |
            Scripts/strategies/.cache
            Scripts/strategies/.store
          key: ohlcv-store-${{ github.run_id }}
          restore-keys: |
            ohlcv-store-

      - name: Install dependencies
        run: pip install -r requirements.txt requests beautifulsoup4

      - name: Run opportunity scanners
        run: python web/start_dashboard.py --data-only

      - name: Export static data for frontend
        run: python Scripts/deploy/export_static_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/opportunities
          git diff --cached --quiet || (git commit -m "chore: refresh opportunity data" && git push)
